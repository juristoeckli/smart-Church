services:
  api:
    environment:
      STREAMING_CONFIG_FILE: /run/secrets/streaming.json
      SMART_CHURCH_VIDEO_STEFFISBURG_UNIFI_API_KEY: ${SMART_CHURCH_VIDEO_STEFFISBURG_UNIFI_API_KEY:-}
      BMD_CONVERTER_DS700_HOST: ${SMART_CHURCH_VIDEO_STEFFISBURG_DS700_HOST:-${BMD_CONVERTER_DS700_HOST:-10.6.70.90}}
      BMD_CONVERTER_DS700_PORT: ${SMART_CHURCH_VIDEO_STEFFISBURG_DS700_PORT:-${BMD_CONVERTER_DS700_PORT:-19540}}
      BMD_CONVERTER_CLIENT_MAC: ${SMART_CHURCH_VIDEO_STEFFISBURG_CLIENT_MAC:-${BMD_CONVERTER_CLIENT_MAC:-9c:5c:8e:00:c7:ac}}
    volumes:
      - type: bind
        source: ${SMART_CHURCH_STREAMING_CONFIG_PATH:-./apps/api/src/modules/video-steffisburg/streaming.steffisburg.json}
        target: /run/secrets/streaming.json
        read_only: true
