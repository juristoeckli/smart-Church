<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scan group attendance code · Smart-Church</title>
  <style>
    body { margin: 0; background: #f4f6f8; color: #17212a; font: 1rem system-ui, sans-serif; }
    main { max-width: 36rem; margin: auto; padding: 1.25rem; }
    h1 { font-size: 1.6rem; }
    video { width: 100%; border-radius: .5rem; background: #182129; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin-block: 1rem; }
    button, input { font: inherit; }
    button { min-height: 2.75rem; padding: .5rem .85rem; }
    input { display: block; max-width: 100%; margin-block: .4rem; }
  </style>
</head>
<body>
  <main>
    <h1>Scan group attendance code</h1>
    <p id="status" role="status" aria-live="polite">Point a camera at the attendance QR code or choose a photo.</p>
    <video id="preview" aria-label="Live camera preview" autoplay muted playsinline hidden></video>
    <div class="controls">
      <button id="start" type="button">Start camera</button>
      <button id="stop" type="button" hidden>Stop camera</button>
      <button id="close" type="button">Close scanner</button>
    </div>
    <label>Take or choose a photo<input id="photo" type="file" accept="image/*" capture="environment" /></label>
  </main>
  <script type="module" src="/src/modules/check-in/attendance-camera-page.ts"></script>
</body>
</html>
