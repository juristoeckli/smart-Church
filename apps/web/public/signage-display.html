<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="dark"><title>Smart-Church display</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#111b19;color:#f5f7f4;font-family:system-ui,sans-serif}body{overflow:hidden}#screen{height:100%;display:flex;flex-direction:column;justify-content:center;padding:8vw;background:radial-gradient(ellipse at 20% 10%,#263b37,#111b19 70%)}#screen h1{font-size:7vw;font-size:clamp(2rem,7vw,7rem);line-height:1.08;margin:0 0 3vh;overflow-wrap:anywhere}#screen p{font-size:3.5vw;font-size:clamp(1.3rem,3.5vw,3.5rem);white-space:pre-wrap;line-height:1.4;margin:0;overflow-wrap:anywhere}#screen.media,#screen.blank{padding:0;background:#000}#screen img,#screen video{width:100%;height:100%;object-fit:contain}#status{position:fixed;bottom:12px;left:20px;font-size:12px;color:#a4b8ac;opacity:.7}body.display-connected #status,body.display-connected #disconnect{display:none}#setup{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;background:radial-gradient(ellipse at 20% 10%,#303142,#171923);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;gap:18px;z-index:3}#setup[hidden]{display:none}#setup h1{font-size:6vw;font-size:clamp(2rem,6vw,4rem);margin:0}#setup p{max-width:520px;line-height:1.6;color:#b4b5c6}label{display:grid;gap:9px}input{padding:16px;font:inherit;font-size:24px;letter-spacing:.12em;width:min(85vw,540px);border:1px solid #ffffff40;border-radius:10px;background:#ffffff0c;color:#fff}button{font:inherit;padding:14px 22px;border:0;border-radius:9px;color:#fff;background:#79628d;cursor:pointer}#pair-error{color:#e8a1ac!important}#disconnect{position:fixed;right:14px;bottom:8px;font-size:11px;padding:7px;background:#ffffff0b;opacity:.25}#disconnect:hover,#disconnect:focus{opacity:1}

</style></head>
<body><main id="screen"></main><span id="status" role="status">Connecting…</span><button id="disconnect" type="button">Disconnect</button>
<section id="setup"><span>SMART-CHURCH · PUBLIC SIGNAGE</span><h1>Connect this screen</h1><p>On your computer, open Signage → Displays, select the display, and enter this code in “Replace screen”.</p><output id="pair-code" aria-label="Screen pairing code" style="font-size:7vw;font-size:clamp(2.5rem,7vw,5rem);font-weight:700;letter-spacing:.15em;white-space:nowrap">Connecting…</output><p id="pair-expiry" role="status"></p><button id="pair-button" type="button">Get a new code</button><p id="pair-error" role="alert"></p></section>
<script>
window.addEventListener("error", function (event) {
  var message = document.getElementById("pair-error");
  message.textContent = "Player error: " + (event.message || "Could not load the player. Check the network and reload.") + " · " + navigator.userAgent;
});
</script>
<script src="/signage-player.js"></script></body></html>
