services:
  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the deployment .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the deployment .env}
    volumes:
      - smart-church-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - smart-church-private

  api:
    image: ghcr.io/juristoeckli/smart-church-api:${SMART_CHURCH_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: ${SMART_CHURCH_DATABASE_URL:-}
      SMART_CHURCH_RESEND_API_KEY: ${SMART_CHURCH_RESEND_API_KEY:-}
      SMART_CHURCH_EMAIL_FROM: ${SMART_CHURCH_EMAIL_FROM:-}
      SMART_CHURCH_RESEND_WEBHOOK_SECRET: ${SMART_CHURCH_RESEND_WEBHOOK_SECRET:-}
      SMART_CHURCH_WEB_ORIGIN: ${SMART_CHURCH_WEB_ORIGIN:-}
      SMART_CHURCH_TRUST_PROXY: ${SMART_CHURCH_TRUST_PROXY:-}
      SMART_CHURCH_DIRECT_HTTP: ${SMART_CHURCH_DIRECT_HTTP:-0}
      SMART_CHURCH_DIRECT_HTTP_PORT: ${SMART_CHURCH_DIRECT_HTTP_PORT:-81}
      SMART_CHURCH_DIRECT_HTTP_HOSTS: ${SMART_CHURCH_DIRECT_HTTP_HOSTS:-}
      SMART_CHURCH_ALLOW_HTTP_FALLBACK: ${SMART_CHURCH_ALLOW_HTTP_FALLBACK:-1}
      SMART_CHURCH_HTTP_PORT: ${SMART_CHURCH_HTTP_PORT:-80}
      SMART_CHURCH_DEPARTMENT_ID: ${SMART_CHURCH_DEPARTMENT_ID:-00000000-0000-4000-8000-000000000001}
      SMART_CHURCH_DEPARTMENT_NAME: ${SMART_CHURCH_DEPARTMENT_NAME:-Location not configured}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EVENTDESK_EMAIL_FROM: ${EVENTDESK_EMAIL_FROM:-}
      PRESENTER_DATASETS_DIR: /var/lib/smart-church/presenter-datasets
      PRESENTER_MEDIA_DIR: /var/lib/smart-church/presenter-media
      SMART_CHURCH_SYNC_ENCRYPTION_KEY: ${SMART_CHURCH_SYNC_ENCRYPTION_KEY:-}
      SMART_CHURCH_SYNC_IDENTITY_KEY_FILE: ${SMART_CHURCH_SYNC_IDENTITY_KEY_FILE:-/var/lib/smart-church/sync/identity-ed25519.pem}
      SMART_CHURCH_REDUNDANCY_SYNC_INTERVAL_SECONDS: ${SMART_CHURCH_REDUNDANCY_SYNC_INTERVAL_SECONDS:-60}
      SMART_CHURCH_VIDEO_STEFFISBURG_ENABLED: ${SMART_CHURCH_VIDEO_STEFFISBURG_ENABLED:-1}
      SMART_CHURCH_VIDEO_STEFFISBURG_UNIFI_API_KEY: ${SMART_CHURCH_VIDEO_STEFFISBURG_UNIFI_API_KEY:-}
      SMART_CHURCH_VIDEO_STEFFISBURG_TOKEN_KEY_FILE: /var/lib/smart-church/video-steffisburg/youtube-token-key
      STREAMING_STATE_DIR: /var/lib/smart-church/video-state
      SYSTEM_LAPTOP_JSON_SECRET_KEY: ${SYSTEM_LAPTOP_JSON_SECRET_KEY:-}
      SYSTEM_LAPTOP_RDP_HOST: ${SYSTEM_LAPTOP_RDP_HOST:-}
      SYSTEM_LAPTOP_RDP_PORT: ${SYSTEM_LAPTOP_RDP_PORT:-3389}
      SYSTEM_LAPTOP_RDP_USERNAME: ${SYSTEM_LAPTOP_RDP_USERNAME:-}
      SYSTEM_LAPTOP_RDP_PASSWORD: ${SYSTEM_LAPTOP_RDP_PASSWORD:-}
      SYSTEM_LAPTOP_GUACAMOLE_API_URL: http://system-laptop-guacamole:8080/guacamole
    ports:
      - "${SMART_CHURCH_API_BIND_ADDRESS:-127.0.0.1}:${SMART_CHURCH_API_HOST_PORT:-3001}:3001"
    volumes:
      - smart-church-data:/var/lib/smart-church
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(async r => { const j = await r.json(); if (!r.ok || j.status !== 'ok') process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - smart-church-private

  web:
    image: ghcr.io/juristoeckli/smart-church-web:${SMART_CHURCH_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${SMART_CHURCH_WEB_BIND_ADDRESS:-127.0.0.1}:${SMART_CHURCH_WEB_HOST_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - smart-church-private

  caddy:
    image: caddy:2-alpine
    profiles: ["bundled-proxy"]
    restart: unless-stopped
    environment:
      SMART_CHURCH_DOMAIN: ${SMART_CHURCH_DOMAIN:-church.example.org}
    ports:
      - "${SMART_CHURCH_HTTPS_BIND_ADDRESS:-0.0.0.0}:${SMART_CHURCH_HTTP_PORT:-80}:80"
      - "${SMART_CHURCH_HTTPS_BIND_ADDRESS:-0.0.0.0}:${SMART_CHURCH_HTTPS_PORT:-443}:443"
    volumes:
      - ${SMART_CHURCH_CADDYFILE:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - smart-church-caddy-data:/data
      - smart-church-caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      smart-church-private:
        ipv4_address: ${SMART_CHURCH_PROXY_IP:-${SMART_CHURCH_NGINX_IP:-172.30.250.2}}

volumes:
  smart-church-postgres:
  smart-church-data:
  smart-church-caddy-data:
  smart-church-caddy-config:

networks:
  smart-church-private:
    ipam:
      config:
        - subnet: ${SMART_CHURCH_DOCKER_SUBNET:-172.30.250.0/24}
          ip_range: ${SMART_CHURCH_DOCKER_IP_RANGE:-172.30.250.64/26}
