services:
  api:
    depends_on:
      amx-module:
        condition: service_completed_successfully

  web:
    image: ghcr.io/juristoeckli/smart-church-web-amx:${SMART_CHURCH_VERSION:-latest}

  amx-module:
    image: ghcr.io/juristoeckli/smart-church-module-amx:${SMART_CHURCH_VERSION:-latest}
    pull_policy: missing
    restart: "no"
    volumes:
      - smart-church-modules:/modules
