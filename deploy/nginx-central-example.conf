# Example complete HTTPS virtual host for a central Nginx installation.
# Adapt the certificate paths and upstream private IP for your environment.
# Include this file from nginx's http {} context (for example, conf.d/).

log_format smart_church '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

upstream smart_church_api {
  server 10.0.0.20:3001;
}

upstream smart_church_web {
  server 10.0.0.20:8080;
}

server {
  listen 443 ssl;
  http2 on;
  server_name church.example.org;

  ssl_certificate /etc/nginx/certs/church.example.org/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/church.example.org/privkey.pem;

  access_log /var/log/nginx/smart-church-access.log smart_church;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 1024m;

  location /api/ {
    proxy_pass http://smart_church_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://smart_church_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
